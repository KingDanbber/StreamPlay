<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="description" content="Reproductor profesional de listas M3U / IPTV. Moderno, responsivo y con tema claro/oscuro.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamPlay">
  <title>StreamPlay — Reproductor M3U</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="btn-icon sidebar-toggle" id="sidebarToggle" aria-label="Menú">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>StreamPlay</span>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="installBtn" aria-label="Instalar app" title="Instalar StreamPlay" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <button class="btn-icon" id="themeToggle" aria-label="Cambiar tema">
          <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="btn-icon" id="fullscreenBtn" aria-label="Pantalla completa">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="main-layout">
      <!-- Sidebar / Channel List -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="load-section">
            <input type="text" id="playlistUrl" placeholder="URL de lista M3U..." class="url-input">
            <button class="btn-primary" id="loadUrlBtn" title="Cargar URL">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
            </button>
            <button class="btn-secondary" id="savePlaylistBtn" title="Guardar esta lista">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
              </svg>
            </button>
            <label class="btn-secondary file-btn" title="Cargar archivo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
              <input type="file" id="fileInput" accept=".m3u,.m3u8,text/plain" hidden>
            </label>
          </div>

          <div class="saved-playlists" id="savedPlaylists">
            <div class="saved-header">
              <span class="presets-label">Mis listas</span>
              <button class="btn-text" id="clearHistoryBtn" title="Limpiar historial de canales" hidden>Limpiar recientes</button>
            </div>
            <div class="saved-list" id="savedList"></div>
          </div>

          <div class="presets">
            <span class="presets-label">Listas recomendadas:</span>
            <div class="preset-btns">
              <button class="preset-btn" data-url="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8">Free-TV</button>
              <button class="preset-btn" data-url="https://iptv-org.github.io/iptv/categories/news.m3u">Noticias</button>
              <button class="preset-btn" data-url="https://iptv-org.github.io/iptv/categories/sports.m3u">Deportes</button>
              <button class="preset-btn" data-url="https://iptv-org.github.io/iptv/categories/music.m3u">Música</button>
              <button class="preset-btn" data-url="https://iptv-org.github.io/iptv/languages/spa.m3u">Español</button>
              <button class="preset-btn" data-url="https://iptv-org.github.io/iptv/languages/eng.m3u">English</button>
            </div>
          </div>

          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="searchInput" placeholder="Buscar canal..." autocomplete="off">
            <button class="clear-search" id="clearSearch" hidden aria-label="Limpiar">×</button>
          </div>

          <div class="view-tabs" id="viewTabs">
            <button class="view-tab active" data-view="all" id="tabAll">Todos</button>
            <button class="view-tab" data-view="favorites" id="tabFavorites">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              Favoritos
              <span class="fav-badge" id="favBadge" hidden>0</span>
            </button>
            <button class="view-tab" data-view="history" id="tabHistory">
              Recientes
              <span class="fav-badge fav-badge-muted" id="histBadge" hidden>0</span>
            </button>
          </div>

          <div class="filters">
            <select id="groupFilter" class="group-select">
              <option value="">Todos los grupos</option>
            </select>
            <span class="channel-count" id="channelCount">0 canales</span>
          </div>
        </div>

        <div class="channel-list" id="channelList">
          <div class="empty-state" id="emptyState">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/>
            </svg>
            <p>Carga una lista M3U para empezar</p>
            <p class="hint">Usa una URL, un archivo o las listas recomendadas</p>
          </div>
        </div>
      </aside>

      <!-- Player Area -->
      <main class="player-area">
        <div class="video-container" id="videoContainer">
          <video id="videoPlayer" playsinline controls></video>
          <div class="player-overlay" id="playerOverlay">
            <div class="now-playing">
              <img id="currentLogo" src="" alt="" class="current-logo" hidden>
              <div class="now-playing-info">
                <span class="now-playing-label">Reproduciendo</span>
                <h2 id="currentTitle">Selecciona un canal</h2>
                <span id="currentGroup" class="current-group"></span>
              </div>
            </div>
            <div class="loading-spinner" id="loadingSpinner" hidden>
              <div class="spinner"></div>
              <span>Cargando stream...</span>
            </div>
            <div class="error-msg" id="errorMsg" hidden>
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <p id="errorText">No se pudo reproducir este canal</p>
              <button class="btn-primary" id="retryBtn">Reintentar</button>
            </div>
          </div>
        </div>

        <div class="player-info" id="playerInfo">
          <div class="info-left">
            <h3 id="infoTitle">—</h3>
            <p id="infoMeta"></p>
          </div>
          <div class="info-actions">
            <button class="btn-icon" id="favBtn" title="Favorito" disabled>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
            <button class="btn-icon" id="copyUrlBtn" title="Copiar URL del stream" disabled>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- Mobile bottom bar -->
    <nav class="mobile-nav" id="mobileNav">
      <button class="mobile-nav-btn active" data-view="player">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Player</span>
      </button>
      <button class="mobile-nav-btn" data-view="channels">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Canales</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
